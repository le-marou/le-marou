name: Generate Snake Animation

on:
  # Lance automatiquement tous les jours à minuit UTC
  schedule:
    - cron: "0 0 * * *"
  
  # Permet de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:
  
  # Lance à chaque push sur la branche main
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Checkout du code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Génère le snake avec la version 2 (plus stable)
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v2
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00ff41&color_dots=#0d1117,#1a3a1a,#2d5a2d,#41a041,#00ff41
      
      # Push les fichiers générés vers la branche output
      - name: Push github-contribution-grid-snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
