name: Update Profile

on:
  # S'exécute toutes les 6 heures
  schedule:
    - cron: "0 */6 * * *" 
  # Permet de lancer manuellement si besoin
  workflow_dispatch:

jobs:
  # JOB 1 : Mettre à jour les vidéos YouTube
  update-youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "YOUTUBE"
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCxlWRWlrKmdkEpD64q6pxRA"
          max_post_count: 4

  # JOB 2 : Générer le Snake Game
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: le-marou
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
